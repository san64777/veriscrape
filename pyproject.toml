[project]
name = "veriscrape"
version = "0.1.0"
description = "fetch, but it tells you the truth: a verified-fetch primitive that returns a portable trust verdict, not just bytes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sanjay Chauhan", email = "san64777@gmail.com" }]
keywords = [
    "web-scraping", "scraping", "scraper", "anti-bot", "bot-detection",
    "reliability", "data-integrity", "cloudflare", "datadome", "honeypot",
    "verified-fetch", "data-quality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "curl_cffi>=0.7",
    "pydantic>=2",
    "selectolax>=0.3",
]

[project.urls]
Homepage = "https://github.com/san64777/veriscrape"
Repository = "https://github.com/san64777/veriscrape"
Issues = "https://github.com/san64777/veriscrape/issues"

[project.scripts]
veriscrape = "veriscrape.cli:main"

[project.optional-dependencies]
# Comparison tools for the benchmark only, never needed by the library itself.
benchmark = ["requests>=2.31", "scrapling>=0.4", "playwright>=1.40", "browserforge>=1.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip-licenses>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veriscrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
